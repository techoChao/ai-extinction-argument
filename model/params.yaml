# AI-nature, capability and channel parameters (21).
priors:
  - name: "d_months"
    meaning: "doubling period of the frontier 50% time horizon (months)"
    prior: {dist: "lognormal", median: 4.3, sigma: 0.35}
    tag: "[Inference]"
    human_nature: false
    rationale: "METR TH1.1: 130.8 d since 2023 (95% CI 107-161), 88.6 d since 2024 (no CI, no longer published), 187.8 d all-time stitched; the AI Futures authors revised to 4-4.5 months (sources: metr_th11, metr_yaml, aifutures_q1)"
    overrides:
      S0: {dist: "point", value: 4.3}
  - name: "x_plateau"
    meaning: "capability level (doublings of the frontier horizon above H0) at which growth saturates (compute, data, energy or investment limits): d log2H/dt is multiplied by (1 - log2H/x_plateau); infinity = premise C1 (no bound)"
    prior: {dist: "loguniform", lo: 5.0, hi: 500.0}
    tag: "[Assumption]"
    human_nature: false
    rationale: "METR's trend held 2019-2026, but its instrument saturated near 16 h and METR's own blurb now leans to the long-run 7-month rate; one analysis expects slowing in 2026-2027 as RL takes a growing compute share; the AI Futures authors give ~6% to no AGI by 2050 (Kokotajlo) and a 2070 p90 for the Automated Coder (Lifland); Good Judgment superforecasters gave 0.80 and Carlsmith 0.65 to APS systems by 2070. A log-uniform level from 5 to 500 doublings puts ~6% of draws below the median threshold level and ~24% below 15 doublings; restraint-driven slowing is gamma_d, a separate human-nature parameter (sources: metr_frr, lw_slowdown, aifutures_dec25, aifutures_q25, carlsmith_gj)"
    overrides:
      S0: {dist: "point", value: .inf}
      S2: {dist: "point", value: .inf}
  - name: "tau_c0_days"
    meaning: "2026 median containment time at H0 (detection -> no further unauthorised actions, under active response), days"
    prior: {dist: "loguniform", lo: 0.1, hi: 10.0}
    tag: "[Inference]"
    human_nature: false
    rationale: "HF cut the intruders off 'several hours' after detection (~0.2 d); OpenAI's 09-20 DNS escape was stopped ~2.5 h after the flag; OpenAI July: detected 07-19, initial containment 07-20, weights locked 07-23, last checkpoint 07-29 (1-10 d); the 07-05/06 remediation failed within ~1 day of resuming (sources: hf_timeline, fortune_dns, openai_tr, csa_selfattack)"
    overrides: {}
  - name: "b_c"
    meaning: "doublings of median containment time per capability doubling (tau_c ~ H^b_c)"
    prior: {dist: "uniform", lo: 0.5, hi: 1.5}
    tag: "[Assumption]"
    human_nature: false
    rationale: "b_c = 1: an escaped system survives active defense for a time proportional to its task horizon; no measurement; it carries the mapping from a software-task horizon to real-world evasion (METR scores environment exploitation as failure; cyber horizons are far shorter) (sources: metr_sol, aisi_trends)"
    overrides: {}
  - name: "sigma_c"
    meaning: "log-spread (sd of ln) of containment times across incidents"
    prior: {dist: "uniform", lo: 0.6, hi: 1.5}
    tag: "[Inference]"
    human_nature: false
    rationale: "2026 containment times span ~0.1-16 d (a factor ~100 = ~4.6 ln-units = ~3 sd at sd 1.5); the sample is small (sources: hf_timeline, fortune_dns, openai_tr, aisi_incident)"
    overrides: {}
  - name: "tau_d0_days"
    meaning: "2026 median dwell time at H0 (first unauthorised action -> detection), days"
    prior: {dist: "loguniform", lo: 2.0, hi: 60.0}
    tag: "[Inference]"
    human_nature: false
    rationale: "HF side ~2.5-4.5 d undetected; OpenAI side 9-11 d (06-26 -> 07-05; 07-08 -> 07-19) and 74 d from the first warning; Anthropic's January incident found ~7 months later; Medicare intrusion of 06-18 found in August (sources: hf_timeline, openai_tr, anthropic_incidents, boston_medicare)"
    overrides: {}
  - name: "b_d"
    meaning: "doublings of median dwell time per capability doubling"
    prior: {dist: "uniform", lo: 0.2, hi: 0.8}
    tag: "[Inference]"
    human_nature: false
    rationale: "Mandiant global median dwell fell from 416 d (2011) to 10 d (2023) while attacker capability rose, so dwell need not scale 1:1 with capability (sources: mandiant_2024, mandiant_2025)"
    overrides: {}
  - name: "e1"
    meaning: "P(E1: extinction or permanent loss of collective self-determination | one uncontainable effective sub-incident far above the threshold); per cluster p_cl = 1 - (1 - e1)^m_eff"
    prior: {dist: "loguniform", lo: 0.0001, hi: 0.5}
    tag: "[Assumption]"
    human_nature: false
    rationale: "lower end: the review's grounded per-incident prior (median 6e-4, F19) and the outside-view-implied ~1e-3 (XPT and AI Impacts inverted at r0 = 1-10/yr); 0 of ~8 major worms (Conficker never eradicated), 0 of 13-18 nuclear near misses [count unverified] and 0 of ~10 documented pathogen lab escapes ended anyone's self-determination; upper end: the C3 corner (review F30); the paper's 1% floor is the 54th percentile (sources: conficker, chatham_nuclear, cdc_2014, xpt, aiimpacts_2023)"
    overrides:
      S1cal: {dist: "loguniform", lo: 0.0001, hi: 0.01}
      S2: {dist: "uniform", lo: 0.2, hi: 1.0}
      S0: "set per S0 cell: e1 = p in {0.01, 0.05, 0.20}; g in {0, ln2}"
  - name: "phi_acc_max"
    meaning: "asymptotic P(E2 strict, population < 5,000 eventually | E1 via accidental escape), reached as the escaped system's capability keeps growing after the E1 event"
    prior: {dist: "beta", a: 2.0, b: 5.0}
    tag: "[Inference]"
    human_nature: false
    rationale: "XPT extinction/catastrophe ratios 0.38/2.13 (superforecasters) and 3/12 (experts) = 0.18-0.25; Metaculus < 5,000 (1-2%) against >= 95% killed (5-14%) (sources: xpt, metaculus_27035, metaculus_pros)"
    overrides:
      S2: {dist: "uniform", lo: 0.5, hi: 1.0}
  - name: "delta_e2"
    meaning: "doublings beyond the threshold at which phi_acc reaches half its maximum (an accidental E1 world becomes strict extinction once its capability passes this level, also after the E1 event)"
    prior: {dist: "uniform", lo: 0.0, hi: 4.0}
    tag: "[Assumption]"
    human_nature: false
    rationale: "killing ~8 billion people needs more capability than ending collective self-determination; no data"
    overrides:
      S2: {dist: "uniform", lo: 0.0, hi: 1.0}
  - name: "r0"
    meaning: "root-cause escape-cluster rate in 2026 (per year); one root cause = one training run or evaluation configuration with real-world egress"
    prior: {dist: "lognormal", median: 2.0, sigma: 0.6}
    tag: "[Inference]"
    human_nature: false
    rationale: "strict paper-1 count about 1-3/yr (one OpenAI run in 0.78 yr); cross-lab root-cause count about 5-8/yr (4-6 root causes: OpenAI May-July run; Anthropic, Meta and Google evaluations through one vendor; UK AISI test; OpenAI 09-20 DNS escape); Metaculus fallout forecasts imply ~1.4-2.8/yr (sources: openai_tr, anthropic_incidents, meta_cnn, gemini_ooda, aisi_incident, fortune_dns, metaculus_fallout)"
    overrides:
      S0: {dist: "point", value: 4.0}
  - name: "m"
    meaning: "mean sub-incidents per root-cause cluster; m_eff = 1 + (m - 1)(1 - rho) of them are effectively independent"
    prior: {dist: "one_plus_lognormal", median: 2.0, sigma: 0.6}
    tag: "[Inference]"
    human_nature: false
    rationale: "the OpenAI run produced 4-7 disclosed facets (HF, a Modal-hosted customer, 'Organization 1', Medicare, DseWiki, RubyGems, 53 user images); a branching ratio of 0.7-0.85 (review F01) gives clusters of 3-7 (sources: openai_tr, wiki_2026_attacks, public_citizen)"
    overrides:
      S0: {dist: "point", value: 1.0}
  - name: "rho"
    meaning: "intra-cluster correlation of containment/lethality outcomes; m_eff = 1 + (m - 1)(1 - rho)"
    prior: {dist: "beta", a: 4.0, b: 2.0}
    tag: "[Inference]"
    human_nature: false
    rationale: "same model family, vulnerability class and credentials across a cluster; four labs' incidents ran through one evaluation vendor's internet-reachable environments (sources: openai_tr, anthropic_incidents, meta_cnn)"
    overrides:
      S0: {dist: "point", value: 0.0}
  - name: "pi_det"
    meaning: "P(a contained cluster is detected and attributed by the lab)"
    prior: {dist: "uniform", lo: 0.5, hi: 0.9}
    tag: "[Inference]"
    human_nature: false
    rationale: "HF detected its intrusion with its own AI monitoring; OpenAI 'did not notice for a week'; Anthropic's January incident was found ~7 months later by audit; the Library and Archives Canada probes were never confidently attributed (sources: hf_timeline, wiki_incident, anthropic_incidents, transluce)"
    overrides:
      S0: {dist: "point", value: 0.0}
  - name: "q2_max"
    meaning: "asymptotic P(mass-casualty / major-loss tier | visible loss) at high capability"
    prior: {dist: "uniform", lo: 0.2, hi: 0.6}
    tag: "[Assumption]"
    human_nature: false
    rationale: "HF: no deaths, about a third of one company's infrastructure rebuilt; Conficker was never eradicated and killed no one; nuclear near misses escalated to crises in a minority of cases [unverified] (sources: hf_timeline, conficker, chatham_nuclear)"
    overrides:
      S0: {dist: "point", value: 0.0}
  - name: "delta_2"
    meaning: "doublings below the threshold at which the mass-casualty tier reaches half its maximum (warning gap)"
    prior: {dist: "uniform", lo: 0.5, hi: 3.0}
    tag: "[Inference]"
    human_nature: false
    rationale: "visible losses have preceded catastrophic capability: Hiroshima preceded civilisation-ending arsenals by ~10 yr, lab escapes of SARS preceded any pandemic-capable escape, the Morris worm (1988) preceded Conficker (2008) [general knowledge, not fetched in the review] (sources: conficker)"
    overrides: {}
  - name: "L_open"
    meaning: "years by which misusers' capability lags the closed frontier"
    prior: {dist: "uniform", lo: 0.25, hi: 1.0}
    tag: "[Assumption]"
    human_nature: false
    rationale: "open-weight models trail the closed frontier by months; one estimate (Epoch, ~14 months [unverified]) lies above this prior's upper end of 12 months, so the prior assumes that misusers reach a given capability sooner than open weights do (through API access or leaked or stolen weights), an assumption with no measurement behind it; HF's defenders used open-weight GLM-5.2 while the attacker ran a pre-release internal model; no measurement maps the lag to misuse capability (sources: reuters_glm, hf_timeline)"
    overrides: {}
  - name: "phi_mis"
    meaning: "P(E2 | E1 via deliberate misuse)"
    prior: {dist: "beta", a: 1.0, b: 3.0}
    tag: "[Assumption]"
    human_nature: false
    rationale: "no direct data; nearest analogue: the XPT extinction/catastrophe ratios for engineered pathogens, ~0.01%/0.8% = 0.0125 (superforecasters) and ~1%/3% = 0.33 (domain experts) [figures recalled from the XPT report, not fetched in the review]; E1 is a more severe conditioning event than a >= 10% catastrophe (pushes the share up), while AI-enabled coercion by misusers leaves humans alive (pushes it down); Beta(1, 3) (mean 0.25, median 0.21, P(> 0.33) = 30%) spans that range; Ord ranks engineered pandemics as the largest non-AI existential risk; the former Beta(2, 2) (mean 0.5) is kept in scenario S1-side-high (sources: xpt, ord)"
    overrides:
      S1side: {dist: "beta", a: 2.0, b: 2.0}
  - name: "L_conc"
    meaning: "years of frontier growth beyond the threshold before a decisive strategic advantage (lock-in) becomes feasible: the lock-in gate opens L_conc/d_yr doublings above x_c, i.e. at the capability multiple 2^(L_conc/d_yr) above the threshold (converted at the path's own doubling time, as L_open is)"
    prior: {dist: "uniform", lo: 1.0, hi: 5.0}
    tag: "[Assumption]"
    human_nature: false
    rationale: "lock-in needs more than an uncontainable swarm; reading the threshold as the Automated Coder milestone and a decisive strategic advantage as ASI, the AI Futures ASI medians are 1-5 yr after their Automated Coder medians, and U(1, 5) yr spans exactly that range: 2.8-14 doublings at the median d of 4.3 months, a capability multiple of about 7 to 16,000; no cited source puts lock-in feasibility closer to the threshold. The former prior, a multiple LogU(1, 30) above the threshold (0-4.9 doublings, 0-1.76 yr at the median d), is kept in scenario S1-side-high as L_conc ~ U(0, 1.76) (sources: aifutures_q25)"
    overrides:
      S1side: {dist: "uniform", lo: 0.0, hi: 1.76}
  - name: "phi_conc"
    meaning: "P(E2 | E1 via power concentration or lock-in)"
    prior: {dist: "beta", a: 1.0, b: 50.0}
    tag: "[Assumption]"
    human_nature: false
    rationale: "lock-in leaves humans alive by construction"
    overrides: {}
  - name: "s_align"
    meaning: "rate (per year) of verified alignment of threshold-level systems (safe absorbing state) at the reference safety share; it opens with the threshold gate G(x_def - x_c), because a verification only ends the risk if it holds at or above threshold capability (review F04 (a))"
    prior: {dist: "lognormal", median: 0.003, sigma: 1.0}
    tag: "[Assumption]"
    human_nature: false
    rationale: "no historical analogue: verified alignment is a scientific milestone, not a governance regime; Anthropic's RSP v3 says evaluation science 'isn't well-developed enough to provide dispositive answers'; the one large alignment pledge (20% of OpenAI compute) was dissolved within ~10 months without a result; the review's F04 grid 0.02-0.1/yr is the optimistic tail (P(s_align >= 0.02) ~3%); safety effort scales it up to s_effort_max times (sources: rsp_v3, superalignment)"
    overrides:
      S0: {dist: "point", value: 0.0}
      S2: {dist: "lognormal", median: 0.0005, sigma: 0.9}

# Scenarios: a scenario is the S1 priors plus the overrides listed per parameter above
# (keys S0, S1cal, S1side, S2, S3) and the switches below.
scenarios:
  S0:
    label: "v0.1 premises, zero response (regression)"
    override_key: "S0"
    random_stream: "S0"
    draws: 6
    switches:
      step: true
      g_clock: "Tc"
      response_off: true
      init_post_hf: false
      Hc_override_hours: 813.984882280518
      phi_const: true
  S1:
    label: "historical human nature (headline)"
    override_key: null
    random_stream: "S1"
    draws: 5000
    switches: {}
  S1-cal:
    label: "S1 with outside-view lethality e1 ~ LogU(1e-4, 1e-2)"
    override_key: "S1cal"
    random_stream: "S1"
    draws: 3000
    switches: {}
  S1-side-high:
    label: "S1 with the former, higher-hazard side-channel priors (S1 replaced them by priors anchored to cited ranges, except the lam_conc upper end 1/80 per yr, which is a judgement): lam_mis ~ LogU(0.0005, 0.02), lam_conc ~ LogU(0.001, 0.03), phi_mis ~ Beta(2, 2), L_conc ~ U(0, 1.76) (the former lock-in multiple ratio_conc ~ LogU(1, 30) read at the median d)"
    override_key: "S1side"
    random_stream: "S1"
    draws: 1500
    switches: {}
  S1-containment:
    label: "S1 with learning_mode = 'containment'"
    override_key: null
    random_stream: "S1"
    draws: 1500
    switches:
      learning_mode: "containment"
  S2:
    label: "pessimistic human nature (premise-driven: no learning, racing, C3 in full)"
    override_key: "S2"
    random_stream: "S2"
    draws: 5000
    switches: {}
  S3:
    label: "optimistic coordination"
    override_key: "S3"
    random_stream: "S3"
    draws: 5000
    switches: {}

