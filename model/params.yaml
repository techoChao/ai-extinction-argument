# Review-finding ids (F01-F40) used in mc.py, model.py and the rationales: the 2026-10-10
# review of paper v0.1. "refuted" means the finding did not survive adversarial verification.
review_findings:
  - id: "F01"
    status: "survived, critical"
    title: "r_0 = 4/yr counts one correlated OpenAI cluster as independent incidents; count root causes"
  - id: "F02"
    status: "survived, critical"
    title: "the inevitability thesis has no timing content; divergence of the sum of p_k is undecidable from finite data"
  - id: "F03"
    status: "survived, critical"
    title: "the 1% floor on p is 1-3 orders of magnitude above analogous base rates and calibrated estimates"
  - id: "F04"
    status: "survived, critical"
    title: "no safe absorbing state; with one at rate s, P(ever hit) = h/(h + s) < 1"
  - id: "F05"
    status: "survived, major"
    title: "'containment about 4 days' is undetected dwell time; detection-to-control at HF took hours"
  - id: "F06"
    status: "survived, major"
    title: "the R8 'nobody chose this' concession is contradicted by disabled safeguards and ignored alerts"
  - id: "F07"
    status: "survived, major"
    title: "unbounded yearly doubling of r; use a capped logistic r(t) with growth g and cap r_max"
  - id: "F08"
    status: "survived, major"
    title: "p = u x e; only e is subject to the anthropic shadow; u is observable"
  - id: "F09"
    status: "survived, major"
    title: "no incident-to-behaviour feedback although pauses, classifiers and bills followed within weeks"
  - id: "F10"
    status: "survived, major"
    title: "H_0 = 17 h is a floor at METR's reliability ceiling; its CI is not propagated into T_c"
  - id: "F11"
    status: "refuted"
    title: "8-12 distinct third-party intrusions in 2026 (about 10/yr)"
  - id: "F12"
    status: "survived, major"
    title: "'uncontained > 30 days' conflates undetected, not eradicated and growing against defense"
  - id: "F13"
    status: "refuted"
    title: "independent 2026 assessments support the 1-working-month threshold"
  - id: "F14"
    status: "refuted"
    title: "no raced technology was halted before a mass-casualty event; brakes are unilateral and short"
  - id: "F15"
    status: "survived, major"
    title: "the dialogue record documents conversational pressure, not evidence"
  - id: "F16"
    status: "survived, major"
    title: "HF observed an escape (r > 0), not p_k > 0; the basis of C3 is an assumption"
  - id: "F17"
    status: "survived, major"
    title: "reported precision exceeds what the inputs allow; Tc_central is the mean of six cells"
  - id: "F18"
    status: "survived, major"
    title: "no yearly-halving analogue: documented learning curves halve in 2-10 yr and reach a floor"
  - id: "F19"
    status: "survived, major"
    title: "a Monte Carlo over explicit priors shows the output is the prior (grounded per-incident p median 6e-4)"
  - id: "F20"
    status: "survived, major"
    title: "misuse and power-concentration channels are omitted under the broad definition"
  - id: "F21"
    status: "survived, major"
    title: "the 50% software horizon is the wrong metric for surviving coordinated defense"
  - id: "F22"
    status: "survived, major"
    title: "METR scores environment exploitation as failure, so the horizon excludes the capability T_c is about"
  - id: "F23"
    status: "survived, major"
    title: "no published autonomy threshold is in horizon units; METR's 1-week rogue-replication tasks are the anchor"
  - id: "F24"
    status: "survived, major"
    title: "the ~700-agent swarm invalidates a single-agent H_0, but it never self-replicated or survived a kill"
  - id: "F25"
    status: "refuted"
    title: "per-incident learning makes P(ever) independent of r (kept here only as an internal identity check)"
  - id: "F26"
    status: "refuted"
    title: "defense rides the same capability curve (a -> 1)"
  - id: "F27"
    status: "survived, major"
    title: "Anthropic's per-run harmful-action rate fell 82% -> 31-33% across one model generation"
  - id: "F28"
    status: "refuted"
    title: "C3 as tabulated implies C2"
  - id: "F29"
    status: "refuted"
    title: "'inevitable' vs 'highly probable' is grounded on the weakest reason"
  - id: "F30"
    status: "survived, major"
    title: "a constant p after T_c contradicts C3; lethality should keep rising with capability"
  - id: "F31"
    status: "refuted"
    title: "six human-nature premises are embedded in constants"
  - id: "F32"
    status: "refuted"
    title: "'surveys would be revised upward' holds for r and timelines, not for p"
  - id: "F33"
    status: "refuted"
    title: "deployment-layer gating fails asymmetrically"
  - id: "F34"
    status: "survived, major"
    title: "C3 became an observation in 2026 (saturated evaluator, RSP v3, unreliable AI forensics)"
  - id: "F35"
    status: "refuted"
    title: "escape-to-detection, not detection-to-control, governs irreversibility"
  - id: "F36"
    status: "survived, major"
    title: "adding misuse and concentration streams can only move T_hit earlier"
  - id: "F37"
    status: "survived, major"
    title: "'extinction' is a disjunction; report E1 (broad) and E2 (strict) separately"
  - id: "F38"
