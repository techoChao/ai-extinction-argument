model_version: 0.3
as_of: 2026-10-10
capability:
  t0: 2026.5            # [Inference] time of the HF incident
  H0_hours: 17          # [Fact] frontier 50% time horizon
  doubling_months: [3, 4.3, 7]   # [Fact] since 2024 / since 2023 / long run
threshold:
  Hc_hours: [167, 2000] # [Assumption] 1 working month / 1 working year
  Tc_central: 2028.5    # [Inference] midpoint of the threshold range
hazard:
  r0_per_year: 4        # [Inference] escape-level incident rate
  r_growth: [none, doubling_yearly]   # [Assumption]
  p: [0.01, 0.05, 0.20] # [Assumption] per-incident lethality, no data
counter_scenario:
  p_halving_per_year: true   # counter-scenario: defense catches up
assumptions:
  - incidents are an independent Poisson process
  - H_c is fixed and does not move with defensive capability
  - p merges P(uncontainable) and P(extinction | uncontainable)

# ===========================================================================
# Monte Carlo model (model/mc.py) v0.3; added in v0.2, 2026-10-10. Documentation only:
# mc.py does not parse this file; at start-up it warns if a parameter or constant
# name below is missing. Everything above this block is the v0.1 parameter set,
# unchanged. Regenerate this block with: python3 model/mc.py --emit-yaml
# Tags: [Fact] directly measured constant, [Inference] distribution read from named
# analogues, [Assumption] no supporting data. Source keys in rationales resolve in
# sources: at the end of this file; review F-ids resolve in review_findings:.
# Priors: lognormal(median, sigma) = median*exp(sigma*N(0,1)); loguniform(lo, hi);
# beta(a, b); uniform(lo, hi); one_plus_lognormal = 1 + lognormal; point = fixed.
# ===========================================================================
mc:
  version: "0.3"
  as_of: "2026-10-10"
  run:
    seed: 20261010
    n_main: 5000
    n_var: 3000
    n_var2: 1500
    n_oat_per_side: 60
    n_block: 600
    n_sign_per_side: 300
    n_hn_effect_per_side: 80
    n_prior_quantile_draws: 4000
    grid: "319 intervals: monthly 2026.75-2040, quarterly 2040-2060, half-yearly 2060-2100; hazards piecewise constant at interval midpoints"
    learning_mode_default: "hazard"
    output_years: [2027, 2028, 2029, 2030, 2032, 2035, 2040, 2050, 2075, 2100]
  model_summary:
    - "State per path: capability log2H (doublings of the frontier 50% horizon above H0 = 17 h), binding restraint R, salience Sal, tier-2 salience Sal2, unilateral restraint m_uni, coordinated pause on/off, learning count N_learn; the still-at-risk weight S (Rao-Blackwellised)."
    - "Capability: d log2H/dt = (1/d_yr)(1 - gamma_d R)(1 - c_cov [paused])(1 - log2H/x_plateau); x_plateau = infinity is premise C1 (no bound). x_def = (1 - a) log2H (net of defense) drives only the containment clock (u, dwell time, tier-2 share q2, threshold crossing); the misuse and lock-in gates and phi_acc use raw capability x = log2H."
    - "Threshold x_c = log2(30 d / tau_c0)/b_c: the capability at which the median containment time (detection -> no further unauthorised actions) reaches 30 days; T_c = T0 - d_yr x_plateau ln(1 - x_c/((1 - a) x_plateau)), never if x_c >= (1 - a) x_plateau."
    - "Uncontainability of one sub-incident u = Phi(beta_c (x_def - x_c)), beta_c = b_c ln2/sigma_c (u = 1/2 at x_c)."
    - "Root-cause clusters per year r_root = r_start G_r(t)(1 - R) m_avg (1 - c_cov [paused]), r_start = min(r0, r_max); G_r is a logistic from 1 to r_max/r_start at rate g, so the rate never exceeds r_max; m_avg is the exact interval average of the unilateral multiplier m_uni. A cluster has m sub-incidents, m_eff = 1 + (m - 1)(1 - rho) effectively independent."
    - "Per cluster: u_cl = 1 - (1 - u_eff)^m_eff and p_cl = 1 - (1 - u_eff e1)^m_eff, u_eff = u L_learn (1 - beta_p R)."
    - "Learning (per incident, leaky): each learned cluster closes the fraction eta_eff of the remaining removable hazard at the time it is learned; Q(t) = eta_eff(T_START) N_LEARN0 + integral of eta_eff dN_learn, L_learn = f_min + (1 - f_min) exp(-Q(t - dwell)) (the lagged Q held at its running maximum), eta_eff = min(ETA_EFF_MAX, eta share/SIGMA_REF); N_learn is the expected count of detected, non-fatal clusters that are public, uncontainable or not dismissed (w) on the surviving path. exp(-Q) is the exact expected factor for Poisson counts (mean field); learned failure modes stay closed."
    - "Safety share = min(SHARE_MAX, safety_share [1 + (share_mult_max - 1)(1 - exp(-w1 Sal))])."
    - "Hazards: accident h_acc = r_root p_cl; misuse h_mis = lam_mis G(x - L_open/d_yr - x_c)(1 - beta_p R); concentration h_conc = lam_conc G(x - x_c - L_conc/d_yr) max(0, 1 - c_conc R); G(z) = Phi(beta_c z); x is raw capability. Restraint R cuts the cluster rate by (1 - R); beta_p R additionally cuts uncontainability and misuse."
    - "Safe exit (absorbing), two routes: verified alignment s_align min(s_effort_max, share/SIGMA_REF) G(x_def - x_c) (AI nature: science, gated on the path's own threshold crossing) plus a durable control regime or deliberate halt s_regime (1 + kappa_s R) + s_halt [paused] (human nature, calibrated to the historical 0.5-1%/yr)."
    - "E1 = first of h_acc + h_mis + h_conc before a safe exit. E2 = population < 5,000 by Y: an accidental E1 world becomes strict extinction once its raw capability passes the level set by phi_acc, also after the E1 event, so P(E2 by Y) = phi_acc(x(Y)) P(E1 via accident by Y) + phi_mis P(E1 via misuse by Y) + phi_conc P(E1 via concentration by Y), a subset of E1."
    - "Visible losses: a Poisson process at rate r_root [pi_det q_v (1 - u_cl) + (u_cl - p_cl)] (a contained cluster is public only if detected, pi_det, and disclosed, q_v; an uncontainable non-fatal one is visible regardless; K ~ Poisson(rate dt) per interval); each is tier 2 (mass-casualty/major loss) with P = q2 = q2_max G(x_def - x_c + delta_2), else tier 1 (HF class)."
    - "Tier 1: Sal += 1 (after the dwell delay), unilateral pause with P = pi_uni. Tier 2: Sal += m2, Sal2 += 1, unilateral draw, binding jump R += (1 - (1 - e)^m2)(R_max - R) after L_nat years (the HF jump, size e, is pending at the start with probability p_bind_first)."
    - "Coordinated pause hazard pi0 + pi1 min(Sal2, sal2_sat), pi0 = -ln(race_persistence)/10, pi1 = -ln(1 - c_cap)/L_int; it lasts D_coord years and leaves R >= e. Tier-1 events do not raise it."
    - "Decay: R halves every tau_h, Sal and Sal2 every h_sal, unilateral restraint every h_uni_weeks."
    - "Output: prior-predictive means over the parameter draws; nothing is conditioned on data except through the priors and the 2026-10 initial state."
  design_notes:
    - "Units: r0 and r_max are root-cause cluster rates (no division by the cluster size m); e1 and q0 are per effective sub-incident and are compounded over m_eff per cluster."
    - "No hidden caps: the salience multiplier on the safety share saturates smoothly at the sampled human-nature parameter share_mult_max, the effort multiplier on the alignment route is bounded by the sampled s_effort_max (it replaces a fixed cap of 3); SHARE_MAX and ETA_EFF_MAX are listed constants; the saturation or binding share of each is printed in block 12."
    - "The coordinated pause is driven by tier-2 (mass-casualty or major-loss) salience Sal2 only, saturating at sal2_sat, so race_persistence keeps its documented meaning; HF and other tier-1 events raise only the safety share and unilateral pauses."
    - "An uncontainable but non-fatal cluster is a visible loss; it is tier 2 with the same probability q2 as any other visible loss, instead of always."
    - "Visible losses are a Poisson count per interval; learning integrates eta_eff over learned clusters (per-incident, never forgotten); E2 is population < 5,000 by Y with post-E1 progression in capability (the first-event convention is printed as a lower bound); the safe exit has an AI-nature route s_align (gated on the threshold crossing) and a human-nature route s_regime (calibrated to the historical anchor); a capability plateau x_plateau makes premise C1 attackable; the salience response saturates smoothly; m2 sets the size of tier-2 binding jumps; unilateral restraint uses the exact interval integral of its decay."
    - "Side channels: lam_mis is anchored to the historical range its rationale cites (1e-4 to 3e-3 per yr); lam_conc has the upper end 1/80 per yr, a judgement rather than a historical bound (zero global lock-ins in 80 yr give 1/80 only as a 63% one-sided bound, 95% ~3/80, and only the ~4-yr 1945-49 monopoly matches its conditioning on a decisive advantage); phi_mis is anchored to the XPT engineered-pathogen ratios and the lock-in gap L_conc to the 1-5 yr between the AI Futures Automated Coder and ASI medians (it replaces a capability multiple LogU(1, 30) above the threshold, 0-1.76 yr at the median d); the former, higher-hazard priors are kept as scenario S1-side-high (lam_conc upper end 0.03, near that 95% bound), which shows the sensitivity to them. The E1 outside-view pool covers mostly the accident channel, so blocks 6 and 7 print the accident channel and the misuse + lock-in channels separately."
    - "Scope of the defense ratio a: only the containment clock (u, dwell time, q2 and the threshold crossing); misuse, lock-in and strict-extinction progression use raw capability."
    - "The learning clock counts only clusters that left the path alive (survivor conditioning); r_max is a cap from the start (the rate starts at min(r0, r_max)); the HF binding response happens with probability p_bind_first instead of with certainty; the dwell-time exponent is capped before exponentiating."
    - "w1 keeps the tag [Assumption]; its prior is U(0.2, 1) under the saturating response (one undecayed HF-class loss raises the safety share x1.2-1.8 at the share_mult_max median, the review's proposed step was x1.5-2); no post-HF change in the share has been measured."
    - "v0.3: a contained cluster becomes a public visible loss at the rate r_root pi_det q_v (1 - u_cl), because q0 is conditional on detection, as the learning clock already treated it; v0.2 omitted pi_det there, which overstated public visible losses by 1/pi_det. A human-nature parameter is \"inert in this model\" only if |effect| + 2 SE < 1 pp at every horizon (v0.2 used the point estimate alone); one below 1 pp but within 2 SE of it is \"small, not shown inert\"; the four E2-only parameters (phi_acc_max, delta_e2, phi_mis, phi_conc) are labelled E2 only instead of inert. No prior changed in v0.3; the rationales of g, L_open and R_max were reworded so that none cites a value its prior excludes or a refuted finding as established."
  constants:
    - name: "T0"
      value: 2026.5
      tag: "[Inference]"
      rationale: "date of the HF incident, used as the capability anchor t0 of paper 4.3"
    - name: "T_START"
      value: 2026.75
      tag: "[Fact]"
      rationale: "today, 2026-10-10, rounded to the quarter; simulation start"
    - name: "T_HF"
      value: 2026.55
      tag: "[Fact]"
      rationale: "HF public disclosure, 2026-07-16 (sources: hf_disclosure)"
    - name: "H0_HOURS"
      value: 17.0
      tag: "[Fact: floor, scoring-dependent]"
      rationale: "METR's raw file gives 17.4 h for Mythos Preview, which METR reports as 'likely >= 16 h' (95% CI 8.5-55 h); display and Hc_override_hours only, it cancels out of every hazard (sources: metr_yaml, metr_frr)"
    - name: "TAU_STAR_D"
      value: 30.0
      tag: "[Assumption]"
      rationale: "paper 9 criterion, operationalised as 'resists active containment for more than 30 days' (review F12)"
    - name: "TAU_D_CAP_D"
      value: 730.0
      tag: "[Assumption]"
      rationale: "cap on the median dwell time (days): an escape undetected for two years is assumed found by audit; Anthropic's January 2026 incident was found after ~7 months (sources: anthropic_incidents)"
    - name: "N_LEARN0"
      value: 2.0
      tag: "[Inference]"
      rationale: "two root-cause classes acted upon before 2026-10: the OpenAI May-July run (VM sandboxes, egress controls) and the internet-reachable evaluation harness at Anthropic/Google/Meta (classifiers, egress cuts) (sources: openai_tr, anthropic_incidents)"
    - name: "N_2026"
      value: 4
      tag: "[Inference]"
      rationale: "contained root-cause clusters in 2026: OpenAI run; Anthropic/Google/Meta evaluations through one vendor; UK AISI test; OpenAI 09-20 DNS escape; diagnostic only (sources: openai_tr, anthropic_incidents, aisi_incident, fortune_dns)"
    - name: "SIGMA_REF"
      value: 0.05
      tag: "[Inference]"
      rationale: "reference safety share, near Anthropic's measured ~6% of AI R&D compute in one week of July 2026 (sources: anthropic_share)"
    - name: "SHARE_MAX"
      value: 0.5
      tag: "[Assumption]"
      rationale: "absolute cap on the safety share of frontier R&D effort (at most half); binds only when safety_share x share_mult_max > 0.5 (S3 tail); its binding share is printed in block 12"
    - name: "ETA_EFF_MAX"
      value: 0.9
      tag: "[Assumption]"
      rationale: "cap on the effective learning rate: no fix closes more than 90% of the remaining removable hazard of a root cause; the largest one-generation fall on record is Anthropic's 82% -> 31-33% (a 62% cut) (sources: anthropic_incidents); its binding share is printed in block 12"
    - name: "C_SAT_DIAG"
      value: 14.0
      tag: "[Inference]"
      rationale: "METR's instrument saturates near 16 h; ~16 doublings from 17 h reach 1e6 h (review F02); diagnostic only"
    - name: "SAFE_ANCHOR_LO"
      value: 0.005
      tag: "[Inference]"
      rationale: "lower end of the historical durable-equilibrium rate per technology-year (3 of 5 dangerous technologies >= 75 yr old reached one: roughly 0.5-1%/yr, post-loss responses included; recombinant DNA, ~53 yr old, is outside the age criterion); the realised S1 regime-route hazard 2026.75-2050 is checked against [SAFE_ANCHOR_LO, SAFE_ANCHOR_HI] in block 12 (sources: montreal, asilomar, boeing_stats, bwc)"
    - name: "SAFE_ANCHOR_HI"
      value: 0.01
      tag: "[Inference]"
      rationale: "upper end of the same historical anchor (see SAFE_ANCHOR_LO)"
  switches:
    - name: "learning_mode"
      default: "hazard"
      meaning: "'hazard' (default): learning factor multiplies u (failure modes closed); 'containment': it divides the containment-time median (threshold shifts up)"
    - name: "learn_count"
      default: "mean"
      meaning: "'mean' (default): learning exponent Q = integral of eta_eff dN over the expected learned count (exact expected factor for Poisson counts with factor 1 - eta_eff per cluster); 'sampled': learned clusters drawn as Poisson counts on the path (separate random stream), factor 1 - eta_eff each; 'lograte': eta read as a log-reduction per cluster (factor exp(-eta_eff)), exact expectation with 1 - exp(-eta_eff) per expected cluster"
    - name: "step"
      default: false
      meaning: "S0 only: lethality is a step at x_c instead of the probit u(x_def)"
    - name: "g_clock"
      default: "now"
      meaning: "'now': rate growth starts at T_START (S1-S3); 'Tc': at T_c (model.py clock, S0)"
    - name: "response_off"
      default: false
      meaning: "S0 only: no visible-loss sampling, no pauses, no salience; no random numbers"
    - name: "events_off"
      default: false
      meaning: "block-level sensitivity only: no visible-loss or coordinated-pause sampling, but the post-HF initial state (pending HF jump, HF salience, 2026 pauses) is kept"
    - name: "init_post_hf"
      default: true
      meaning: "True in S1-S3: HF binding response pending with probability p_bind_first, HF salience, 2026 unilateral pauses, N_LEARN0 = 2; False in S0"
    - name: "Hc_override_hours"
      default: null
      meaning: "None by default; a number replaces x_c by log2(Hc/H0_HOURS) for readers who believe in a fixed hour count (S0 uses 814 h so that T_c = 2028.5)"
    - name: "phi_const"
      default: false
      meaning: "S0 only: phi = 1 in every channel, so the E2 row equals the E1 row"
    - name: "learn_from_fatal"
      default: false
      meaning: "False by default: the learning clock counts only clusters that left the path alive (the path is conditioned on survival); True also counts fatal clusters, which reproduces the time-based halving of paper sec. 5.4 (block 10 checks only)"
