    tag: "[Inference]"
    human_nature: true
    rationale: "HF's own AI monitoring detected the intrusion (after under-escalating) and self-hosted GLM-5.2 did the forensics in hours, while closed frontier models refused part of the work; Glasswing partners found >10,000 high/critical vulnerabilities in a month and 14% of disclosed ones were patched; a -> 1 was proposed and refuted on magnitude (review F26); a = 0 is the paper premise (sources: hf_timeline, reuters_glm, glasswing)"
