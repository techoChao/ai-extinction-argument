model_version: 0.1
as_of: 2026-10-10
capability:
  t0: 2026.5            # [Inference] time of the HF incident
  H0_hours: 17          # [Fact] frontier 50% time horizon
  doubling_months: [3, 4.3, 7]   # [Fact] since 2024 / since 2023 / long run
threshold:
  Hc_hours: [167, 2000] # [Assumption] 1 working month / 1 working year
  Tc_central: 2028.5    # [Inference] midpoint of the threshold range
hazard:
  r0_per_year: 4        # [Inference] escape-level incident rate
  r_growth: [none, doubling_yearly]   # [Assumption]
  p: [0.01, 0.05, 0.20] # [Assumption] per-incident lethality, no data
counter_scenario:
  p_halving_per_year: true   # counter-scenario: defense catches up
assumptions:
  - incidents are an independent Poisson process
  - H_c is fixed and does not move with defensive capability
  - p merges P(uncontainable) and P(extinction | uncontainable)
