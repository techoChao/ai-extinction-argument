  - name: "a"
    meaning: "defense growth ratio: fraction of offensive capability growth matched by defenders' containment tooling. It acts only on the containment clock: x_def = (1 - a) log2(H/H0) sets uncontainability, the dwell time, the tier-2 share q2 and the path's own threshold crossing (which also opens the alignment gate); the misuse and lock-in gates and the strict-extinction progression use raw capability log2(H/H0)"
